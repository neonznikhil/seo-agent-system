name: RankForge CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest

      - name: Syntax and Type Verification
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/services/knowledge_service.py
          python -m py_compile backend/agents/writer_agent.py
          python -m py_compile backend/routers/workforce.py
          python -m py_compile backend/routers/connectors.py
          python -m py_compile backend/agents/scheduler.py

  frontend-build:
    name: Frontend Build (Node 18)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend-next
        run: npm ci || npm install

      - name: Build Frontend Next.js
        working-directory: ./frontend-next
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: rankforge-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend-next/Dockerfile
          push: false
          tags: rankforge-frontend:latest
