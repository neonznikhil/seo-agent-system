services:
  - type: web
    name: rankforge-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    branch: main
    healthCheckPath: /health
    startCommand: cd /app/backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NIM_LLM_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: NIM_LLM_FALLBACK
        value: poolside/laguna-xs-2.1
      - key: NIM_EMBED_MODEL
        value: nvidia/nemotron-3-embed-1b

      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: rankforge-redis
          type: redis
          property: connectionString
      - key: ALLOWED_CORS_ORIGINS
        value: https://rankforge-frontend.onrender.com,http://localhost:3000
      - key: CORS_ORIGINS
        value: https://rankforge-frontend.onrender.com,http://localhost:3000
      - key: FRONTEND_URL
        value: https://rankforge-frontend.onrender.com
      - key: BACKEND_URL
        value: https://rankforge-backend.onrender.com
      - key: ENVIRONMENT
        value: production

  - type: web
    name: rankforge-frontend
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: frontend-next
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: BACKEND_URL
        value: https://rankforge-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://rankforge-backend.onrender.com/api
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: PORT
        value: 10000

  - type: redis
    name: rankforge-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: WARNING: Open to all. Restrict to backend service IP in production.
