version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rankforge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - FERNET_SECRET_KEY=${FERNET_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-${ENCRYPTION_KEY}}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-${ENCRYPTION_KEY}}
      - JWT_SECRET=${JWT_SECRET}
      - NIM_LLM_MODEL=${NIM_LLM_MODEL:-meta/llama-3.2-11b-vision-instruct}
      - NIM_LLM_FALLBACK=${NIM_LLM_FALLBACK:-poolside/laguna-xs-2.1}
      - NIM_EMBED_MODEL=${NIM_EMBED_MODEL:-nvidia/nemotron-3-embed-1b}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - UVICORN_WORKERS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - ./backend/local_data:/app/backend/local_data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rankforge-net


  frontend:
    build:
      context: .
      dockerfile: frontend-next/Dockerfile
    container_name: rankforge-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_KEY=${NEXT_PUBLIC_SUPABASE_KEY}
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - rankforge-net

  redis:
    image: redis:7-alpine
    container_name: rankforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - rankforge-net

volumes:
  redis-data:

networks:
  rankforge-net:
    driver: bridge

