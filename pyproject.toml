[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-agent-system"
version = "0.1.0"
description = "RANKFORGE Autonomous SEO Agent System"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "RANKFORGE" }
]
keywords = ["seo", "aeo", "geo", "ai", "automation", "crewai", "supabase"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "supabase>=2.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "crewai>=0.5.0,<1.0.0",
    "langchain>=0.1.0",
    "tenacity>=8.2.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "requests>=2.31.0",
    "redis>=5.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-httplib2>=0.2.0",
    "crawlee[all]==0.4.8",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "lxml>=4.9.0",
    "parsel>=1.8.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/nikhiladwaan/seo-agent-system"
Documentation = "https://github.com/nikhiladwaan/seo-agent-system#readme"
Repository = "https://github.com/nikhiladwaan/seo-agent-system"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "backend"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
