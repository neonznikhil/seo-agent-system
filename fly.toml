# fly.toml for RankForge
# https://fly.io/docs/reference/configuration/

app = "rankforge"
primary_region = "sin"  # Singapore (closest to India)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  LLM_PROVIDER = "nvidia"
  NIM_LLM_MODEL = "nvidia/nemotron-3-nano-30b-a3b"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  release_command = "echo 'Deployment complete'"
